name = "MassGapFormal"
version = "0.2.0"
defaultTargets = ["AreaLaw"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "AreaLaw"

[[lean_lib]]
name = "Influence"

[[lean_lib]]
name = "Positivity"

[[lean_lib]]
name = "OneScale"

[[lean_lib]]
name = "Attempts"

[[lean_lib]]
name = "ProofPhase"

[[require]]
name = "arsenal"
git = "https://github.com/StevenHrovat/im"
rev = "e1e95bd25975b03f09577b84bd8877a4ff6f3f01"
subDir = "arsenal"
