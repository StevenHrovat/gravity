[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[lean_lib]]
name = "AreaLaw"

[[lean_lib]]
name = "Influence"

[[lean_lib]]
